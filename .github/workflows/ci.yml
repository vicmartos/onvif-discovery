name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Check SonarQube Cloud configuration
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$SONAR_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN is unavailable; skipping SonarQube Cloud analysis."
          fi

      - name: Cache SonarQube Cloud tools
        if: ${{ steps.sonar.outputs.enabled == 'true' }}
        id: cache-sonar-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sonar-tools
          key: ${{ runner.os }}-sonar-tools-11.3.0-coverage-18.11.2

      - name: Install SonarQube Cloud tools
        if: ${{ steps.sonar.outputs.enabled == 'true' && steps.cache-sonar-tools.outputs.cache-hit != 'true' }}
        run: |
          dotnet tool install dotnet-sonarscanner --tool-path "$RUNNER_TEMP/sonar-tools" --version 11.3.0
          dotnet tool install dotnet-coverage --tool-path "$RUNNER_TEMP/sonar-tools" --version 18.11.2

      - name: Cache SonarQube Cloud plugins
        if: ${{ steps.sonar.outputs.enabled == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sonar-cache
          key: ${{ runner.os }}-sonar-plugins-v1

      - name: Begin SonarQube Cloud analysis
        if: ${{ steps.sonar.outputs.enabled == 'true' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          "$RUNNER_TEMP/sonar-tools/dotnet-sonarscanner" begin
          /k:"vicmartos_onvif-discovery"
          /o:"vicmartos"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.exclusions="**/bin/**/*,**/obj/**/*,OnvifDiscovery/Client/OnvifUdpClient.cs"
          /d:sonar.cs.vscoveragexml.reportsPaths="$RUNNER_TEMP/coverage.xml"
          /d:sonar.plugin.cache.directory="$RUNNER_TEMP/sonar-cache"
          /d:sonar.qualitygate.wait=true
          /d:sonar.qualitygate.timeout=300

      - name: Restore
        run: dotnet restore OnvifDiscovery.sln --disable-build-servers -m:1

      - name: Build
        run: >-
          dotnet build OnvifDiscovery.sln
          --configuration Release
          --no-restore
          --no-incremental
          --disable-build-servers
          -m:1
          -p:Version=0.0.0-ci

      - name: Run tests with coverage
        if: ${{ steps.sonar.outputs.enabled == 'true' }}
        run: >-
          "$RUNNER_TEMP/sonar-tools/dotnet-coverage" collect
          "dotnet OnvifDiscovery.Tests/bin/Release/net10.0/OnvifDiscovery.Tests.dll -noColor -noLogo"
          -f xml
          -o "$RUNNER_TEMP/coverage.xml"

      - name: Run tests
        if: ${{ steps.sonar.outputs.enabled != 'true' }}
        run: dotnet OnvifDiscovery.Tests/bin/Release/net10.0/OnvifDiscovery.Tests.dll -noColor -noLogo

      - name: Complete SonarQube Cloud analysis
        if: ${{ steps.sonar.outputs.enabled == 'true' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: '"$RUNNER_TEMP/sonar-tools/dotnet-sonarscanner" end /d:sonar.token="$SONAR_TOKEN"'

      - name: Pack probe package
        run: >-
          dotnet pack OnvifDiscovery/OnvifDiscovery.csproj
          --configuration Release
          --output artifacts
          --no-build
          --no-restore
          --disable-build-servers
          -m:1
          -p:Version=0.0.0-ci

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail

          nupkg="artifacts/OnvifDiscovery.0.0.0-ci.nupkg"
          test -f "$nupkg"

          package_files=$(unzip -Z1 "$nupkg")
          grep -Fxq "README.md" <<< "$package_files"
          grep -Fxq "lib/net8.0/OnvifDiscovery.dll" <<< "$package_files"
          grep -Fxq "lib/net8.0/OnvifDiscovery.xml" <<< "$package_files"
          grep -Fxq "lib/net10.0/OnvifDiscovery.dll" <<< "$package_files"
          grep -Fxq "lib/net10.0/OnvifDiscovery.xml" <<< "$package_files"
          unzip -p "$nupkg" README.md | cmp -s README.md -

          nuspec=$(unzip -p "$nupkg" '*.nuspec')
          grep -Fq '<id>OnvifDiscovery</id>' <<< "$nuspec"
          grep -Fq '<version>0.0.0-ci</version>' <<< "$nuspec"
          grep -Fq '<license type="expression">MIT</license>' <<< "$nuspec"
          grep -Fq '<readme>README.md</readme>' <<< "$nuspec"
          grep -Fq '<repository type="git" url="https://github.com/vicmartos/onvif-discovery"' <<< "$nuspec"
